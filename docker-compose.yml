services:
  postgres:
    image: postgres:15-alpine
    container_name: bank_ledger_postgres
    volumes:
      - data-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: nikhil
      POSTGRES_PASSWORD: Mahi1234
      POSTGRES_DB: bank_ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikhil -d bank_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_ledger_api
    ports:
      - "8080:8080"
    environment:
      DB_URL: "postgresql://nikhil:Mahi1234@postgres:5432/bank_ledger?sslmode=disable&TimeZone=Asia/Kolkata"
      PORT: "8080"
      JWT_SECRET: "0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data-volume:
